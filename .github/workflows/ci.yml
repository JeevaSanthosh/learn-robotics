# Every push/PR must clear the same acceptance loop used during development:
# build (C1) + 60 static conditions + interpreter runtime tests.
name: CI
on:
  push: { branches: [main] }
  pull_request: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm test
