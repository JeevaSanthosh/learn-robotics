# Monthly resource freshness check.
# Pipeline: verify links (deterministic) -> discover candidates (search API)
#           -> judge (LLM, strict JSON) -> validate (zod + domain allowlist)
#           -> open a PR for human review. Never auto-commits to main.
#
# Secrets to configure (Settings -> Secrets and variables -> Actions):
#   GROQ_API_KEY     - LLM judging (or swap the script to another provider)
#   BRAVE_API_KEY    - candidate discovery (optional; script skips if absent)
#   YOUTUBE_API_KEY  - video liveness + publish dates (optional; script skips if absent)

name: Resource freshness check

on:
  schedule:
    - cron: '17 6 1 * *' # 06:17 UTC on the 1st of each month (odd minute avoids the crowded :00 slot)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Run freshness script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/freshness.mjs

      - name: Open PR with proposed updates
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          branch: freshness/monthly-update
          commit-message: 'chore: monthly resource freshness update'
          title: '🤖 Monthly resource freshness update'
          body: |
            Automated monthly check of `public/resources.json`.

            Review checklist for the human:
            - [ ] Open each changed link — is it genuinely clearer for a beginner teen?
            - [ ] Is the content age-appropriate?
            - [ ] Check the Cloudflare Pages preview deployment on this PR.

            Sources were validated against the domain allowlist in resources.json.
            If nothing changed this month, this PR won't appear.
          add-paths: public/resources.json
          delete-branch: true
